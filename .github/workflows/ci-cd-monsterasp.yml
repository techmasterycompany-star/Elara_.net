name: CI/CD Pipeline - MonsterASP Deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_VERSION: '9.0.x'
  SOLUTION_FILE: Elara.sln
  PROJECT_FILE: src/Elara.API/Elara.API.csproj

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

  build-deploy-package:
    name: Build Deploy Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API for deployment
        run: |
          dotnet publish ${{ env.PROJECT_FILE }} \
            --configuration Release \
            --output ./deploy-package \
            --self-contained false \
            /p:UseAppHost=false \
            /p:PublishTrimmed=false

      - name: Copy configuration files
        run: |
          cp src/Elara.API/appsettings.json ./deploy-package/appsettings.json
          cp src/Elara.API/appsettings.Production.json ./deploy-package/appsettings.Production.json 2>/dev/null || true

      - name: Inject production secrets (only overrides set secrets)
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          EMAIL_CLIENT_URL: ${{ secrets.EMAIL_CLIENT_URL }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          python3 -c "
          import os, json
          p = './deploy-package/appsettings.Production.json'
          with open(p) as f: cfg = json.load(f)
          injected, missing = [], []
          def setv(path, env):
              v = os.environ.get(env, '')
              node = cfg
              *heads, last = path.split('.')
              for h in heads: node = node.setdefault(h, {})
              if not v:
                  missing.append(path + ' (kept file value)')
                  return
              node[last] = v
              injected.append(path)
          setv('Jwt.Key', 'JWT_KEY')
          setv('ConnectionStrings.DefaultConnection', 'DB_CONNECTION')
          setv('Cloudinary.CloudName', 'CLOUDINARY_CLOUD_NAME')
          setv('Cloudinary.ApiKey', 'CLOUDINARY_API_KEY')
          setv('Cloudinary.ApiSecret', 'CLOUDINARY_API_SECRET')
          setv('Email.ClientUrl', 'EMAIL_CLIENT_URL')
          setv('Email.Smtp.Username', 'EMAIL_SMTP_USERNAME')
          setv('Email.Smtp.Password', 'EMAIL_SMTP_PASSWORD')
          setv('Google.ClientId', 'GOOGLE_CLIENT_ID')
          setv('Stripe.SecretKey', 'STRIPE_SECRET_KEY')
          setv('Stripe.PublishableKey', 'STRIPE_PUBLISHABLE_KEY')
          setv('Stripe.WebhookSecret', 'STRIPE_WEBHOOK_SECRET')
          setv('PayPal.ClientId', 'PAYPAL_CLIENT_ID')
          setv('PayPal.ClientSecret', 'PAYPAL_CLIENT_SECRET')
          with open(p, 'w') as f: json.dump(cfg, f, indent=2)
          print('Injected from GitHub Secrets: ' + (', '.join(injected) if injected else '(none)'))
          print('Missing secrets, kept file value: ' + (', '.join(missing) if missing else '(none)'))
          "

      - name: Copy web.config for IIS
        run: cp .github/workflows/web.config ./deploy-package/web.config

      - name: Create logs directory
        run: mkdir -p ./deploy-package/logs

      - name: Upload deploy package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: ./deploy-package/
          retention-days: 7

  deploy-monsterasp-ftp:
    name: Deploy to MonsterASP via FTP
    runs-on: ubuntu-latest
    needs: build-deploy-package
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    steps:
      - name: Download deploy package
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: ./deploy-package

      - name: Take site offline (unlock DLLs)
        env:
          FTP_HOST: ${{ secrets.MONSTERASP_FTP_HOST }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.MONSTERASP_FTP_DIR }}
        run: |
          python3 -c "
          import os, ftplib
          host = os.environ['FTP_HOST'].replace('ftp://','').replace('ftps://','').strip().rstrip('/')
          if ':' in host: host = host.split(':')[0]
          user = os.environ['FTP_USER']
          pwd = os.environ['FTP_PASS']
          remotedir = os.environ.get('FTP_DIR','/').strip() or '/'
          print(f'Uploading app_offline.htm to {host}:{remotedir}')
          with open('app_offline.htm','w') as f: f.write('Site is updating, please try again shortly.')
          ftp = ftplib.FTP(host, timeout=30)
          ftp.login(user, pwd)
          try: ftp.cwd(remotedir)
          except Exception as e: print(f'cwd warning: {e}')
          with open('app_offline.htm','rb') as f: ftp.storbinary('STOR app_offline.htm', f)
          ftp.quit()
          print('Site taken offline.')
          "
          sleep 15

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_HOST }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          server-dir: ${{ secrets.MONSTERASP_FTP_DIR }}/
          local-dir: ./deploy-package/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/*
            **/*.md
            **/Dockerfile
            **/docker-compose*.yml

      - name: Bring site back online
        if: always()
        env:
          FTP_HOST: ${{ secrets.MONSTERASP_FTP_HOST }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.MONSTERASP_FTP_DIR }}
        run: |
          python3 -c "
          import os, ftplib
          host = os.environ['FTP_HOST'].replace('ftp://','').replace('ftps://','').strip().rstrip('/')
          if ':' in host: host = host.split(':')[0]
          user = os.environ['FTP_USER']
          pwd = os.environ['FTP_PASS']
          remotedir = os.environ.get('FTP_DIR','/').strip() or '/'
          ftp = ftplib.FTP(host, timeout=30)
          ftp.login(user, pwd)
          try: ftp.cwd(remotedir)
          except Exception as e: print(f'cwd warning: {e}')
          try:
              ftp.delete('app_offline.htm')
              print('app_offline.htm removed, site online.')
          except Exception as e: print(f'delete warning (maybe already gone): {e}')
          ftp.quit()
          "

      - name: Deployment Summary
        run: |
          echo "Deployment to MonsterASP completed!"
          echo "Your site should be live at your MonsterASP domain"